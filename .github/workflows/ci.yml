name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it carries the deploy, and interrupting that
  # leaves the container down.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check the capture pipeline
        run: npm run manual:check

      - name: Run tests
        run: npx jest --ci --coverage=false

      # The deploy builds the image; `tsc` and `jest` do not run webpack.
      - name: Production build
        run: npm run build

  deploy:
    # Why this job lives here rather than in its own workflow: two workflows on
    # the same push run in parallel, so the deploy raced the tests and regularly
    # finished first. `needs` only reaches jobs in the same workflow.
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Never `pull_request`: code from a fork must not run on the production host.
    runs-on: [self-hosted, production]
    environment: production

    # Serialise deploys without ever cancelling one in flight.
    concurrency:
      group: deploy-production-webapp
      cancel-in-progress: false

    env:
      # ENV_FILE_PATH is exported by the decrypt step below, from runner.temp,
      # which does not exist in a job's env context. A step running before it
      # fails on an empty path rather than reading some other file.
      #
      # Must match the project the running container belongs to.
      COMPOSE_PROJECT_NAME: datamap-webapp

    steps:
      - uses: actions/checkout@v4

      - name: Show what is being deployed
        run: git log --oneline -1

      - name: Install the pinned sops
        run: bash scripts/install_sops.sh

      # --input-type: sops infers the format from the extension, and `.env.sops`
      # is not one it knows. umask first, not chmod after: creating the file
      # readable leaves a window.
      - name: Decrypt the environment
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/env"
          "$HOME/bin/sops" --decrypt --input-type dotenv --output-type dotenv \
            secrets/production/frontend.env.sops \
            > "$RUNNER_TEMP/env/frontend.env"
          ls -l "$RUNNER_TEMP/env/frontend.env"
          echo "ENV_FILE_PATH=$RUNNER_TEMP/env/frontend.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY_FILE: /home/datamap/.config/sops/age/keys.txt

      # `docker compose down` deletes the container along with its log file, so
      # without this every deploy erases the evidence of whatever it is fixing.
      - name: Archive the log of the container about to be replaced
        run: |
          dir="${{ vars.LOG_ARCHIVE_DIR || '/home/datamap/logs' }}"
          mkdir -p "$dir"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if docker inspect datamap_frontend >/dev/null 2>&1; then
            docker logs -t datamap_frontend 2>&1 | gzip > "$dir/datamap_frontend-$stamp.log.gz"
          fi
          find "$dir" -name '*.log.gz' -mtime +30 -delete

      - name: Build and restart
        run: make ENV_FILE_PATH="$ENV_FILE_PATH" docker-deployment

      - name: Wait for the site to answer
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            case "$code" in
              200|30*) echo "healthy ($code)"; exit 0 ;;
            esac
            sleep 5
          done
          echo "The site did not answer within five minutes."
          docker logs --tail 100 datamap_frontend
          exit 1

      - name: Container status
        if: always()
        run: docker ps --filter "name=datamap_frontend" --format "table {{.Names}}\t{{.Status}}"

      # Always, including after a failure: the runner's temp directory outlives
      # a failed job long enough to matter.
      - name: Remove the decrypted environment
        if: always()
        run: rm -rf "$RUNNER_TEMP/env"

      - name: Logs on failure
        if: failure()
        run: docker logs --tail 200 datamap_frontend
