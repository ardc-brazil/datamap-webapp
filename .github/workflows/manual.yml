name: manual

# Never `pull_request`: this job starts containers and pushes a branch, and code
# from a fork must not do either with this repository's token.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/manual/**"
      - "manual-capture/**"

concurrency:
  group: manual
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: datamap-webapp

      # `make manual` reads the stack from ../gatekeeper, so the two sit side by
      # side. GATEKEEPER_CHECKOUT_TOKEN needs read access to ardc-brazil/gatekeeper.
      - uses: actions/checkout@v4
        with:
          repository: ardc-brazil/gatekeeper
          path: gatekeeper
          token: ${{ secrets.GATEKEEPER_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: datamap-webapp/.tool-versions
          cache: npm
          cache-dependency-path: datamap-webapp/package-lock.json

      - name: Install dependencies
        working-directory: datamap-webapp
        run: npm ci

      - name: Install the browser
        working-directory: datamap-webapp
        run: npx playwright install --with-deps chromium

      - name: Generate the captures and the PDF
        working-directory: datamap-webapp
        run: make manual

      - name: Open a pull request with what changed
        working-directory: datamap-webapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- public/manual/img public/manual/guia-datamap.pdf)" ]; then
            echo "The images and the PDF are already up to date."
            exit 0
          fi
          branch="manual/captures-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/manual/img public/manual/guia-datamap.pdf
          git commit -m "docs: update the user guide captures and PDF" -m "Generated by the manual workflow from ${GITHUB_SHA}."
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: update the user guide captures and PDF" \
            --body "Regenerated by the manual workflow, run ${GITHUB_RUN_ID}, from ${GITHUB_SHA}. Review the changed images before merging."

      - name: Keep the server log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-capture-run
          path: datamap-webapp/manual-capture/.run/next.log
          if-no-files-found: ignore
