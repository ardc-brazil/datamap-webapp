version: '3'

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  frontend:
    build: .
    image: datamap_frontend
    container_name: datamap_frontend
    restart: always
    logging: *logging
    env_file:
      - ${ENV_FILE_PATH}
    ports:
      - '3000:3000'
    networks:
      - gatekeeper_gatekeeper-network

networks:
  gatekeeper_gatekeeper-network:
    driver: bridge
    name: gatekeeper_gatekeeper-network
