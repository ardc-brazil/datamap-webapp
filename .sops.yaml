# The same age key as the other DataMap repositories. Its private half lives at
# ~/.config/sops/age/keys.txt on the production host and on each maintainer's
# machine, and in a password manager — the only copy that is a backup.
#
# Losing every copy means re-issuing every credential in here by hand: the ORCID
# and GitHub OAuth secrets, the NextAuth secret, the API client, and the upload
# token the API verifies.
creation_rules:
  - path_regex: secrets/production/.*\.env\.sops$
    input_type: dotenv
    output_type: dotenv
    age: age1mjnhlj26qm97tzvn4dm9k47582jydjmsmhnsgpgswqjl4vt9zacs2knu99
